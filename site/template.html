<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kritik</title>
<meta name="description" content="kritik — a skill that de-biases AI-assisted research and writing against the Western, anti-communist, pro-imperialist defaults language models inherit from training data.">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1c1b19;
    --muted: #6b675f;
    --line: #e3dfd7;
    --accent: #8a3a2a;
    --box-bg: #f3efe7;
    --box-line: #ddd6c8;
    --code-bg: #f1ede4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --fg: #e9e6e0;
      --muted: #a29b8f;
      --line: #2c2924;
      --accent: #d97a5c;
      --box-bg: #201e1a;
      --box-line: #38342d;
      --code-bg: #201e1a;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
  h1 { font-size: 2.6rem; letter-spacing: -0.02em; margin: 0 0 .15rem; }
  h1 + p { color: var(--muted); font-size: 1.15rem; margin: 0 0 2.5rem; }
  article img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 2rem 0; box-shadow: 0 2px 14px rgba(0, 0, 0, .08); }
  h2 { font-size: 1.35rem; margin: 2.8rem 0 .8rem; letter-spacing: -0.01em; }
  h3 { font-size: 1.1rem; margin: 2rem 0 .6rem; }
  p { margin: 0 0 1rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.8rem 0; }
  ul, ol { margin: 0 0 1rem; padding-left: 1.4rem; }
  li { margin-bottom: .35rem; }
  blockquote { border-left: 4px solid var(--accent); margin: 1.5rem 0; padding: .1rem 1.2rem; background: var(--box-bg); border-radius: 8px; }
  code { background: var(--code-bg); padding: .12em .35em; border-radius: 4px; font-size: .9em; overflow-wrap: break-word; }
  pre {
    position: relative;
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 3.5rem 1rem 1.2rem; overflow-x: auto; font-size: .9rem; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word;
  }
  pre code { background: none; padding: 0; display: block; }
  .copy-btn {
    position: absolute; top: .45rem; right: .5rem;
    font-family: inherit; font-size: .7rem; line-height: 1.4;
    padding: .15rem .55rem; border-radius: 5px; cursor: pointer;
    background: var(--box-bg); border: 1px solid var(--box-line); color: var(--muted);
  }
  .copy-btn:hover { color: var(--fg); }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.5rem; font-size: .93rem; }
  th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .small { font-size: .85rem; }
  footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
  footer img { vertical-align: middle; margin-left: .3rem; border-radius: 4px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

<article>
{{CONTENT}}
</article>

<footer>
  <p class="small">kritik · <a href="https://github.com/eXtremeProgramming-cn/kritik">github.com/eXtremeProgramming-cn/kritik</a> ·
    <a href="https://creativecommons.org/publicdomain/zero/1.0/" aria-label="CC0 1.0 — released under the Creative Commons CC0 public-domain dedication"><img src="cc-zero.svg" alt="CC0 1.0" width="88" height="31" loading="lazy"></a>
  </p>
</footer>

</div>
<script>
  (function () {
    function copyText(text, btn) {
      var done = function () {
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { legacy(text); done(); });
      } else { legacy(text); done(); }
    }
    function legacy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    document.querySelectorAll('pre code').forEach(function (block) {
      var pre = block.parentElement;
      if (pre.querySelector('.copy-btn')) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () { copyText(block.textContent.trim(), btn); });
      pre.appendChild(btn);
    });
  })();
</script>
</body>
</html>
